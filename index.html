<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UDC2026 中間シンポジウム＠長崎 おもてなしマップ</title>
    <meta name="description" content="UDC2026 中間シンポジウム＠長崎の参加者のためのデジタルマップ。会場周辺のグルメ・観光・お土産情報を「形」と「明るさ」で分かりやすくお届けします。">
    <!-- OGP -->
    <meta property="og:title" content="UDC2026 中間シンポジウム＠長崎 おもてなしマップ">
    <meta property="og:description" content="長崎の地域データとオープンデータの未来を考える。シンポジウム会場周辺のおすすめスポットを快適に探索できるスマホ特化型マップです。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tetsuji1122.github.io/nagasaki-map/"> <!-- 実際のURLに合わせて変更してください -->
    <meta property="og:image" content="https://tetsuji1122.github.io/nagasaki-map/img/ogp.png"> <!-- プレビュー画像 -->
    <meta property="og:site_name" content="UDC2026 長崎おもてなしマップ">
    <meta property="og:locale" content="ja_JP">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ランディングページ -->
    <div id="landing-page">
        <div class="slideshow">
            <div class="slide" style="background-image: url('img/photo01s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo02s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo03s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo04s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo05s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo06s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo07s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo08s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo09s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo10s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo11s.jpg');"></div>
            <div class="slide" style="background-image: url('img/photo12s.jpg');"></div>
        </div>
        <div class="landing-content">
            <div class="landing-title">長崎から考える、<br>地域データとオープンデータの未来</div>
            <div class="landing-subtitle">アーバンデータチャレンジ 2026 中間シンポジウム</div>
            <div class="landing-actions">
                <button class="enter-btn" onclick="enterMap()">マップを見る</button>
                <a href="https://udc2026-2nd-symposium.peatix.com/" target="_blank" class="register-btn">参加申し込み</a>
            </div>
        </div>
        <div class="landing-footer">
            Landscape photos provided by <a href="https://find47.jp/" target="_blank">FIND/47</a> under <a href="https://creativecommons.org/licenses/by/4.0/deed.ja" target="_blank">CC BY 4.0</a>
        </div>
    </div>

    <header>
        <h1>UDC2026 中間シンポジウム＠長崎 おもてなしマップ</h1>
        <a href="https://udc2026-2nd-symposium.peatix.com/" target="_blank" class="header-link">参加申し込み</a>
    </header>

    <!-- カテゴリフィルター -->
    <div id="filter-container">
        <button class="filter-btn active" data-category="all">すべて</button>
        <button class="filter-btn" data-category="venue">会場</button>
        <button class="filter-btn" data-category="food">グルメ</button>
        <button class="filter-btn" data-category="souvenir">お土産</button>
        <button class="filter-btn" data-category="sightseeing">観光</button>
        <button class="filter-btn" data-category="favorites">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px; vertical-align: middle;">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>お気に入り
        </button>
    </div>

    <!-- サブカテゴリフィルター -->
    <div id="sub-filter-container" class="hidden">
        <!-- JSで動的に生成 -->
    </div>

    <!-- マップエリア -->
    <div id="map"></div>

    <!-- 現在地ボタン -->
    <button class="locate-btn" onclick="locateUser()" title="現在地を表示">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#3498db">
            <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
        </svg>
    </button>

    <!-- スポットカルーセル -->
    <div id="carousel"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom Script -->
    <script src="js/script.js"></script>
</body>
</html>
